# default configuration for the Unitree A2 factor-graph state estimator.

simulation:
  model_path: "assets/a2.xml"    # Unitree A2 MuJoCo model with position actuators
  duration: 20.0                  # total simulation time [s]
  timestep: 0.002                # MuJoCo physics timestep [s]
  seed: 2137

imu:
  accel_noise_density: 0.01      # [m/s² / sqrt(Hz)]
  gyro_noise_density: 0.001      # [rad/s / sqrt(Hz)]
  accel_bias_rw: 0.0001          # [m/s³ / sqrt(Hz)]
  gyro_bias_rw: 0.00001          # [rad/s² / sqrt(Hz)]
  gravity: 9.81                  # gravity magnitude [m/s²]

estimator:
  keyframe_every_n_steps: 100    # add factor every N simulation steps
  isam_relinearize_skip: 1       # relinearization frequency in iSAM2
  prior_pose_sigma: 0.001        # prior uncertainty on pose [m, rad]
  prior_vel_sigma: 0.01          # prior uncertainty on velocity [m/s]
  prior_bias_sigma: 0.1          # prior uncertainty on IMU bias [m/s², rad/s]

contact_preintegration:
  contact_velocity_noise_sigma: 0.1
  minimum_contact_probability: 0.5
  require_continuous_contact: true
  covariance_epsilon: 1.0e-9

contact_factor:
  prior_contact_sigma: 0.01

noise:
  enabled: true                 # whether to add noise to IMU readings
  accel_white_density: 0.03
  gyro_white_density: 0.001
  accel_bias_density: 0.001
  gyro_bias_density: 0.0001

gait:
  frequency: 0.4                 # slow creep: 2.5s per full cycle
  swing_ratio: 0.25              # fraction of cycle for a leg swing phase
  settle_duration: 2.0           # [s] settle time before walking
  weight_shift_fraction: 0.40    # fraction of swing phase used for weight shift
  hip_shift: 0.03                # hip angle bias for lateral weight shift [rad]
  phase_offset: [0, 3.14159, 0, 3.14159]  # [FR, FL, RR, RL] (unused in creep)
  nominal:
    hip: 0.0                     # neutral abduction [rad]
    thigh: 0.8                   # thigh joint angle [rad]
    calf: -1.6                   # calf joint angle [rad]
  amplitude:
    hip: 0.0                     # hip swing amplitude [rad] (unused, hip used for shift)
    thigh: 0.10                  # thigh swing amplitude [rad]
    calf: 0.30                   # calf swing amplitude [rad] for ground clearance

output:
  plot: true                     # show matplotlib plot after run
  log_csv: false                 # save estimates to CSV
  live_plot: false               # real-time matplotlib joint-angle plot
